<!doctype html>
<!-- Feasibility prototype: one ANDAI street shot built from primitives. Query: ?w=1080&h=1920&ao=0 -->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"http://local/node_modules/three/build/three.module.js","three/addons/":"http://local/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1920), AO = q.get('ao') === '1';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fd8ff');
scene.fog = new THREE.Fog('#cfe6f5', 14, 40);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);

// lights: warm sun + sky fill
scene.add(new THREE.HemisphereLight('#cfe8ff', '#7a6a55', 0.7));
const sun = new THREE.DirectionalLight('#ffd9a0', 2.6);
sun.position.set(-6, 10, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
scene.add(sun);

const mat = (c, r = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const add = (geo, m, x, y, z, parent = scene) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o; };

// world: road, sidewalk, houses, pole (Y up, metres)
add(new THREE.BoxGeometry(60, 0.1, 8), mat('#55595f', 0.9), 0, -0.05, 0);
add(new THREE.BoxGeometry(60, 0.25, 3), mat('#c9c2b6', 0.8), 0, 0.12, -5.2);
for (let i = -3; i <= 3; i++) {                          // lane markings
  add(new THREE.BoxGeometry(1.6, 0.02, 0.15), mat('#f2f2f2'), i * 3.2, 0.01, 0);
}
const houseCols = ['#f2b7c6', '#a9d6c1', '#f6d48b', '#b9c8f2'];
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group(); g.position.set(-7.5 + i * 5, 0.25, -9.5); scene.add(g);
  add(new THREE.BoxGeometry(4.4, 3, 3.2), mat(houseCols[i]), 0, 1.5, 0, g);
  const roof = add(new THREE.CylinderGeometry(0.01, 3.4, 1.6, 4, 1), mat('#c4553f'), 0, 3.8, 0, g);
  roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 0.75);
  add(new THREE.BoxGeometry(0.9, 1.7, 0.1), mat('#6b4a33'), -0.8, 0.85, 1.62, g);
  add(new THREE.BoxGeometry(1.0, 0.8, 0.1), mat('#dff3ff', 0.2), 1.0, 1.7, 1.62, g);
  for (let k = -4; k <= 4; k++) add(new THREE.BoxGeometry(0.08, 0.9, 0.08), mat('#2f3b4a'), k * 0.5, 0.45, 2.6, g); // fence
  add(new THREE.BoxGeometry(4.4, 0.08, 0.08), mat('#2f3b4a'), 0, 0.85, 2.6, g);
}
add(new THREE.CylinderGeometry(0.09, 0.11, 6, 12), mat('#8a8f96'), 2.4, 3, -4.6);

// character "Si Kamu": peanut head (lathe), capsule body/limbs, mitten hands, sandals
const kamu = new THREE.Group(); scene.add(kamu); kamu.position.set(0.2, 0.0, -2.2);
const skin = mat('#c98e5a', 0.45), shirt = mat('#e8743b', 0.7), jeans = mat('#2f4a6d', 0.8);
const head = new THREE.Group(); head.position.set(0, 3.05, 0); kamu.add(head);
const prof = (y0, y1, k = 1) => { const pts = []; for (let i = 0; i <= 40; i++) { const y = y1 - (y1 - y0) * i / 40; const u = y / 1.25;
  const r = Math.sqrt(Math.max(0, 1 - u * u)) * (1.0 + 0.12 * Math.exp(-(((y + 0.35) / 0.55) ** 2))) * k; pts.push(new THREE.Vector2(r, y)); } return pts.reverse(); };
const skull = add(new THREE.LatheGeometry(prof(-1.25, 1.25), 64), skin, 0, 0, 0, head); skull.scale.set(1.0, 1.0, 0.95);
const hairM = mat('#1c1a1a', 0.6);
const hair = add(new THREE.LatheGeometry(prof(0.32, 1.25, 1.04), 64), hairM, 0, 0.02, -0.02, head); hair.scale.set(1.0, 1.02, 0.97); hair.material.side = THREE.DoubleSide;
for (const [x, rz] of [[-0.25, 0.5], [0.05, 0.1], [0.32, -0.4]]) { const tuft = add(new THREE.ConeGeometry(0.2, 0.55, 16), hairM, x, 1.3, 0.15, head); tuft.rotation.set(0.5, 0, rz); }
const eyes = [];
for (const s of [-1, 1]) {
  const e = new THREE.Group(); e.position.set(s * 0.38, 0.05, 0.84); head.add(e);
  const white = add(new THREE.SphereGeometry(0.25, 32, 16), mat('#ffffff', 0.2), 0, 0, 0, e); white.scale.set(1, 1.15, 0.5);
  const pupil = add(new THREE.SphereGeometry(0.11, 24, 12), mat('#141414', 0.15), 0.02 * s, -0.02, 0.1, e);
  const brow = add(new THREE.CapsuleGeometry(0.05, 0.28, 6, 12), hairM, 0, 0.42, 0.02, e); brow.rotation.z = Math.PI / 2 + s * 0.12;
  eyes.push({ e, white, pupil, brow, s });
}
const mouth = add(new THREE.TorusGeometry(0.22, 0.045, 12, 32, Math.PI), mat('#5a1f1f', 0.4), 0, -0.55, 0.97, head); mouth.rotation.z = Math.PI;
const body = add(new THREE.CapsuleGeometry(0.62, 0.7, 12, 24), shirt, 0, 1.45, 0, kamu); body.scale.set(1, 1, 0.8);
const limb = (len, r, m) => { const g = new THREE.Group(); add(new THREE.CapsuleGeometry(r, len, 8, 16), m, 0, -len / 2, 0, g); return g; };
const armL = limb(0.9, 0.15, shirt); armL.position.set(-0.68, 1.95, 0); kamu.add(armL); add(new THREE.SphereGeometry(0.2, 24, 16), skin, 0, -1.05, 0, armL);
const armR = limb(0.9, 0.15, shirt); armR.position.set(0.68, 1.95, 0); kamu.add(armR); add(new THREE.SphereGeometry(0.2, 24, 16), skin, 0, -1.05, 0, armR);
for (const s of [-1, 1]) {
  const leg = limb(0.75, 0.17, jeans); leg.position.set(s * 0.28, 0.95, 0); kamu.add(leg);
  const sandal = add(new THREE.SphereGeometry(0.25, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat('#3fa34d', 0.6), s * 0.28, 0.02, 0.08, kamu); sandal.scale.set(1, 0.5, 1.5);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
if (AO) { const ao = new GTAOPass(scene, cam, W, H); ao.blendIntensity = 0.9; composer.addPass(ao); }
composer.addPass(new OutputPass());
const ease = p => p < 0 ? 0 : p > 1 ? 1 : p * p * (3 - 2 * p);
window.renderFrame = (t) => {
  // camera push-in 1.00 -> ~1.08 framing, slight orbit (true 3D parallax)
  const p = ease(t / 3);
  const ang = -0.3 + 0.2 * p, dist = 14.5 - 2.0 * p;
  cam.position.set(Math.sin(ang) * dist, 2.6 + 0.3 * p, -2.2 + Math.cos(ang) * dist);
  cam.lookAt(0.2, 2.3, -2.2);
  // acting: head tilt, wave, blink at 1.6s, smile widen
  head.rotation.z = 0.08 * Math.sin(t * 2.0);
  head.rotation.y = 0.15 * Math.sin(t * 1.1);
  armR.rotation.z = 2.3 + 0.3 * Math.sin(t * 9);
  armL.rotation.z = -0.15;
  const blink = Math.abs(t - 1.6) < 0.07 ? 0.1 : 1;
  for (const { white, pupil } of eyes) { white.scale.y = 1.15 * blink; pupil.scale.y = blink; }
  mouth.scale.set(1 + 0.25 * p, 1 + 0.4 * p, 1);
  composer.render();
  return true;
};
window.ready = true;
</script></body></html>
