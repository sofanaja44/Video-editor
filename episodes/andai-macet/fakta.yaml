  klaim: "Porsi pergerakan harian di Jakarta yang memakai angkutan umum (di luar ojek/taksi online), data 2022."
  angka: "10,29%"
  ucapan: "sekitar sepuluh persen"
  satuan: persen perjalanan
  sumber:
