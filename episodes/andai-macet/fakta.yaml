  klaim: "Seberapa besar parkir di badan jalan memangkas kapasitas jalan (satu ruas di dekat pasar)."
  angka: "39,03%"
  ucapan: "satu studi di ruas jalan dekat pasar menemukan parkir di badan jalan memangkas kapasitas jalan sekitar tiga puluh sembilan persen"
  satuan: persen kapasitas
  sumber:
    lembaga: "Masrul & Utami, Borneo Engineering: Jurnal Teknik Sipil"
    judul: "Analisis Pengaruh On-Street Parking terhadap Kinerja Jalan di Pasar Jaya Ciracas, Jakarta Timur"
    tahun: 2021
    url: "http://jurnal.borneo.ac.id/index.php/borneoengineering/article/view/2113"
    diakses: "2026-10-24"
  kartu_sumber: "Sumber: studi Masrul & Utami, 2021 (satu ruas jalan)"
  konversi: {teks: null, rumus: null}
  catatan: >
    Hanya satu lokasi, jadi naskah wajib bilang "satu studi di ruas jalan dekat pasar" dan tidak boleh digeneralisasi
    ke semua kota. Abstrak: selisih kapasitas jalan sekitar 39,03%; tingkat layanan jalan D saat ada parkir di badan
    jalan dan bisa naik ke C tanpa parkir. Cari tahu dulu nilai kapasitas absolutnya di PDF penuh bila mau dikutip
    lebih jauh. Angka klasik "30 sampai 40 persen" (Hobbs, 1979) hanya terlihat lewat kutipan studi lain, jadi tidak
    dipakai.
  status: draf
