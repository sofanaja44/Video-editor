# Fakta episode andai-macet. Dicari dan diperiksa 2026-10-24. Status tetap "draf" sampai Gerbang 1 disetujui.
# Aturan: skills/andai/references/01-buku-panduan.md bab 8. Tidak ada angka yang dikarang: semuanya dari sumber di bawah.

- id: F1
  klaim: "Waktu yang hilang di jalan karena macet per pengendara per tahun, untuk berangkat dan pulang di jam sibuk."
  angka: "117 jam"
  ucapan: "seratus tujuh belas jam"
  satuan: jam/tahun
  sumber:
    lembaga: "TomTom (Traffic Index 2023, kota Jakarta), dikutip CNN Indonesia"
    judul: "London Jadi Kota Termacet di Dunia 2023, Jakarta Urutan Berapa?"
    tahun: 2023
    url: "https://www.cnnindonesia.com/gaya-hidup/20240112021519-269-1048410/london-jadi-kota-termacet-di-dunia-2023-jakarta-urutan-berapa/amp"
    diakses: "2026-10-24"
  kartu_sumber: "Sumber: TomTom Traffic Index, 2023"
  konversi:
    teks: "hampir lima hari penuh, tanpa tidur"
    rumus: "117 jam ÷ 24 = 4,875 hari (4 hari 21 jam)"
  catatan: >
    Definisi TomTom (tomtom.com/traffic-index/about): selisih waktu tempuh jam sibuk terhadap jalan lengang untuk
    perjalanan 10 km, pergi-pulang, 230 hari kerja per tahun. Jadi kalimat naskah harus bilang "berangkat dan pulang di
    jam sibuk". Angka 117 jam dikutip lewat CNN (12 Jan 2024); halaman TomTom sendiri tidak bisa dibuka lewat alat
    saya, jadi perlu satu pengecekan oleh manusia bila mau 100% primer.
  status: draf

