- id: F3
  klaim: "Kerugian ekonomi akibat kemacetan di wilayah Jabodetabek per tahun, hitungan Bappenas."
  angka: "Rp65 triliun"
  ucapan: "enam puluh lima triliun rupiah"
  satuan: rupiah/tahun
  sumber:
    lembaga: "Bappenas, dikutip Sekretariat Kabinet RI"
    judul: "Pengelolaan Transportasi Jabodetabek"
    tahun: 2019
    url: "https://setkab.go.id/pengelolaan-transportasi-jabodetabek/"
    diakses: "2026-10-24"
  kartu_sumber: "Sumber: Bappenas via Setkab, 2019"
  konversi:
    teks: "sekitar seratus tujuh puluh delapan miliar rupiah setiap hari"
    rumus: "Rp65.000 miliar ÷ 365 hari = Rp178 miliar per hari"
  catatan: >
    Kutipan asli: "Menurut data Bappenas, kemacetan di wilayah Jabodetabek mengakibatkan kerugian sebesar Rp 65
    Trilliun per tahun" (4 Feb 2019). Hitungan mencakup kesehatan, lingkungan, biaya operasional, bahan bakar yang
    boros, dan produktivitas. Ada angka lain yang lebih besar (Rp100 triliun, dikaitkan dengan studi Bappenas/JUTPI II
    2019 dan disebut pejabat pada 2017 dan 2025); angka itu tidak dipakai karena sumber aslinya tidak ketemu. Konversi
    "per warga" sengaja tidak dipakai: jumlah penduduk Jabodetabek yang resmi tidak berhasil diverifikasi.
  status: draf

