  konversi: {teks: null, rumus: null}
  catatan: >
    Pernyataan Direktur Angkutan BPTJ, 18 Sep 2023, untuk data 2022 (bersumber Dishub DKI dan BPS; total 19,63 juta
    perjalanan per hari). Kutipan asli: "modal share angkutan umum sebesar 18,45% (termasuk angkutan online) atau
    10,29% (di luar angkutan online)". Kita pakai 10,29% (definisi angkutan umum biasa) dan menyebut "sekitar".
